[project]
name = "langchain-course-abhi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhishekdunakhe", email = "abhishekdunakhe@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.4.10",
    "langchain-google-genai>=4.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-course-abhi = "langchain_course_abhi:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
